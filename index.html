<div class="app">
  <header class="hdr" id="hdr">
    <div class="hdr-top">
      <div class="brand">
        <h1>NIJI VOICE</h1>
        <span class="conn" id="connState" role="button" tabindex="0">데모 모드</span>
      </div>
      <div class="hdr-actions">
        <button class="btn-icon" id="btnSearch" type="button" aria-label="검색">
          <svg><use href="#i-search"/></svg>
        </button>
        <button class="nick" id="btnNick" type="button" title="닉네임 변경">
          <span id="nickLabel">게스트</span>
        </button>
        <button class="btn-icon" id="btnRefresh" type="button" aria-label="새로고침">
          <svg><use href="#i-refresh"/></svg>
        </button>
        <button class="btn-icon" id="btnSettings" type="button" aria-label="설정">
          <svg><use href="#i-gear"/></svg>
        </button>
      </div>
    </div>

    <div class="search" id="searchBar" hidden>
      <svg class="search-ico"><use href="#i-search"/></svg>
      <input id="searchInput" type="search" placeholder="라이버나 제목으로 검색" autocomplete="off" enterkeyhint="search" />
      <button class="search-clear" id="btnClearSearch" type="button" hidden aria-label="검색 지우기">
        <svg><use href="#i-close"/></svg>
      </button>
    </div>
  </header>

  <div class="scroller" id="scroller">
    <nav class="tabs" id="viewTabs" aria-label="보기">
      <button class="tab is-on" data-view="all" type="button">전체</button>
      <button class="tab" data-view="folders" type="button">컬렉션</button>
      <button class="tab" data-view="playlists" type="button">보관함</button>
      <button class="tab" data-view="notes" type="button">메모</button>
      <button class="tab" data-view="lyrics" type="button">가사</button>
    </nav>

    <div class="controlbar">
      <button class="btn-playall" id="btnPlayAll" type="button">
        <svg><use href="#i-play"/></svg><span>전체 재생</span>
      </button>
      <div class="cbar-tools">
        <button class="tool" id="btnSort" type="button" aria-label="정렬"><svg><use href="#i-sort"/></svg></button>
        <button class="tool" id="btnFilterToggle" type="button" aria-label="필터">
          <svg><use href="#i-filter"/></svg><span class="tb-count" id="filterCount" hidden></span>
        </button>
        <button class="tool" id="btnOffline" type="button" aria-label="오프라인"><svg><use href="#i-download"/></svg></button>
        <button class="tool" id="btnShuffleAll" type="button" aria-label="셔플"><svg><use href="#i-shuffle"/></svg></button>
      </div>
    </div>

    <main class="list" id="listArea"></main>
    <div class="listfoot" id="listFoot"></div>
  </div>
</div>

<div class="selbar" id="selBar" hidden>
  <span class="selcount" id="selCount">0개 선택</span>
  <div class="selacts">
    <button type="button" data-sel="offline">오프라인</button>
    <button type="button" data-sel="offline-remove" class="danger" hidden>오프라인 삭제</button>
    <button type="button" data-sel="tag">태그</button>
    <button type="button" data-sel="fav">즐겨찾기</button>
    <button type="button" data-sel="playlist">재생목록</button>
    <button type="button" data-sel="cancel" class="ghost">취소</button>
  </div>
</div>

<div class="player" id="playerBar">
  <div class="pprog"><i id="pProg"></i></div>
  <div class="pflags" id="pFlags"></div>
  <div class="prow">
    <button class="pnow" id="btnNow" type="button">
      <span class="pthumb" id="pThumb"><svg><use href="#i-mic"/></svg></span>
      <span class="ptext">
        <span class="ptitle" id="pTitle">재생 중인 보이스 없음</span>
        <span class="psub" id="pSub"></span>
      </span>
    </button>
    <div class="pquick">
      <button type="button" id="btnPlay" class="pbtn-play" aria-label="재생/일시정지"><svg><use href="#i-play"/></svg></button>
      <button type="button" id="btnNext" aria-label="다음 보이스"><svg><use href="#i-next"/></svg></button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grab"></div>
    <header class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button type="button" class="sheet-x" id="sheetClose" aria-label="닫기"><svg><use href="#i-close"/></svg></button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="boot-error" id="bootError" hidden></div>

<audio id="audio" preload="metadata" playsinline></audio>

<script>
  /* boot guard: surfaces a module/parse failure instead of a blank page */
  window.__errors = [];
  window.addEventListener('error', function (e) {
    window.__errors.push(String((e && (e.message || e.error)) || 'error'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    window.__errors.push('promise: ' + String((e.reason && e.reason.message) || e.reason));
  });
  setTimeout(function () {
    if (window.__appReady) return;
    var b = document.getElementById('bootError');
    if (b) {
      b.hidden = false;
      b.textContent = '앱을 불러오지 못했어요. 네트워크를 확인한 뒤 새로고침해 주세요.';
    }
  }, 6000);
</script>
<script type="module" src="js/app.js?v=70"></script>
</body>
</html>
